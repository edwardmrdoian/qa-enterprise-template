# ---- Web UI (Playwright) ----
base.url=https://the-internet.herokuapp.com
browser=chromium
headless=true
timeout.seconds=15

# ---- API ----
api.base.url=https://reqres.in
# reqres.in requires a key. Provide it with -Dapi.key=... or env var API_KEY (never commit it).
api.key=reqres_b708fa3324ee4faea71bbe8cf6b78594

# ---- Database (H2 in-memory by default; switch to PostgreSQL in staging.properties) ----
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:qatestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
db.username=sa
db.password=
db.max.pool.size=10
db.min.idle=2

# ---- RabbitMQ (docker compose up -d) ----
rabbit.host=localhost
rabbit.port=5672
rabbit.username=guest
rabbit.password=guest
rabbit.vhost=/

# ---- Elasticsearch (docker compose up -d) ----
elastic.url=http://localhost:9200
elastic.username=
elastic.password=
