name: QA CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install Chromium
        shell: bash
        run: bash ./mvnw -B -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI '-Dexec.args=install --with-deps chromium'
      - name: Verify deterministic framework suite (no retries)
        shell: bash
        run: bash ./mvnw -B clean verify
      - name: Require executed tests with no skips
        shell: pwsh
        run: ./scripts/check-test-results.ps1
      - name: Verify initialization and renamed project
        shell: pwsh
        run: ./scripts/verify-template.ps1
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        shell: bash
        run: bash ./mvnw -B allure:report
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            target/traces/
            logs/
          if-no-files-found: warn
          retention-days: 7
