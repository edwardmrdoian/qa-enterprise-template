name: QA CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'          # nightly full regression
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment (qa/staging)'
        required: true
        default: 'qa'
      groups:
        description: 'JUnit tag expression (empty = everything), e.g. smoke or api&regression'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pull requests run only the fast smoke suite; everything else runs the requested groups (default: all)
      TEST_GROUPS: ${{ github.event_name == 'pull_request' && 'smoke' || github.event.inputs.groups || '' }}
      TARGET_ENV: ${{ github.event.inputs.target_env || 'qa' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B -q exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          mvn -B clean test \
            -Denv="$TARGET_ENV" \
            -Dgroups="$TEST_GROUPS" \
            -Dheadless=true \
            -Dbrowser=chromium \
            -Drerun.count=1

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Playwright traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: target/traces/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
