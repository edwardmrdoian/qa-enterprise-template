name: Optional QA suites

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Explicitly selected suite (not a required PR check)
        type: choice
        options: [examples, integration, external]
        default: examples
      environment:
        description: Configuration environment
        type: choice
        options: [qa, staging]
        default: qa

permissions:
  contents: read

jobs:
  optional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE: ${{ inputs.suite }}
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Start local integration infrastructure
        if: inputs.suite == 'integration'
        run: docker compose up -d --wait --wait-timeout 180
      - name: Install Chromium for external UI examples
        if: inputs.suite == 'external'
        run: bash ./mvnw -B -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI '-Dexec.args=install --with-deps chromium'
      - name: Run selected suite without retries
        env:
          API_KEY: ${{ inputs.suite == 'external' && secrets.API_KEY || '' }}
        run: bash ./mvnw -B clean test "-P$SUITE" "-Denv=$ENV"
      - name: Require executed tests with no skips
        shell: pwsh
        run: ./scripts/check-test-results.ps1
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: bash ./mvnw -B allure:report
      - name: Collect infrastructure logs
        if: ${{ !cancelled() && inputs.suite == 'integration' }}
        run: |
          mkdir -p logs
          docker compose logs --no-color > logs/infrastructure.log
          docker compose down --volumes
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: optional-${{ inputs.suite }}-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            target/traces/
            logs/
          retention-days: 7
